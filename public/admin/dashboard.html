<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Chapters & Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/book_logo.png">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="fw-bold">Admin Dashboard</h1>
                <p class="text-muted">Manage your store inventory and view customer activity.</p>
            </div>
            <a href="../index.html" class="btn btn-outline-dark">
                <i class="fas fa-home me-2"></i>Back to Site
            </a>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <h4 class="fw-bold mb-3"><i class="fas fa-plus-circle me-2"></i>Add New Book</h4>
                    <form id="addBookForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Book Title</label>
                            <input type="text" id="title" class="form-control" placeholder="e.g. Game of Thrones" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Price (AED)</label>
                            <input type="number" id="price" class="form-control" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Image File Name</label>
                            <input type="text" id="image" class="form-control" placeholder="game_of_throne.jpg" required>
                            <div class="form-text">Ensure the image is in <code>/public/images/</code></div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 mt-2">Add Product</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm border-0 rounded-4">
                    <h4 class="fw-bold mb-3"><i class="fas fa-boxes me-2"></i>Manage Inventory</h4>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Image</th>
                                    <th>Title</th>
                                    <th>Price</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminProductList">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4 g-4">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0 rounded-4 h-100">
                    <h4 class="fw-bold mb-3"><i class="fas fa-users me-2"></i>Recent Users</h4>
                    <div id="recentUsersList">
                        <p class="text-muted">Loading users...</p>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0 rounded-4 h-100">
                    <h4 class="fw-bold mb-3"><i class="fas fa-shopping-cart me-2"></i>Recent Orders</h4>
                    <div id="adminOrdersList">
                        <p class="text-muted text-center py-4">Loading orders...</p>
                    </div>
                    <a href="all-orders.html" class="btn btn-sm btn-link text-dark text-decoration-none mt-auto">View All Orders →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>

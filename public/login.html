<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chapters & Co. - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="images/book_logo.png">
    </head>

<body>
    <header class="user_header">
        <div class="header_1">
            <div class="user_flex">
                <div class="logo_cont">
                    <img src="images/book_logo.png" alt="Logo">
                    <a href="index.html" class="book_logo">Chapters & Co.</a>
                </div>

                <nav class="navbar_links">
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="shop.html">Shop</a>
                    <a href="contact.html">Contact</a>
                    <a href="orders.html">Orders</a>
                </nav>

                <div class="last_part">
                    <form action="search.html" method="GET" class="search_form">
                        <input type="text" name="search" placeholder="Find a book...">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>
                    <div class="icons">
                        <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
                        <a href="login.html" id="user_btn" class="active">
                            <i class="fas fa-user"></i>
                            <span class="login_text">Sign In</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="container py-5 d-flex justify-content-center">
        <div class="questions_card shadow-sm" style="max-width: 500px; margin-top: 50px; background: white; padding: 30px; border-radius: 8px;">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <p class="text-center text-muted mb-4">Please enter your details to continue to checkout.</p>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" id="loginEmail" class="custom_input w-100" placeholder="e.g. name@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="loginPass" class="custom_input w-100" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="product_btn w-100 py-3 mt-2">Login to Account</button>
                
                <div class="mt-4 text-center">
                    <p class="mb-3 text-muted">Or login using your social account</p>
                    
                    <a href="/api/auth/google" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center border-2">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" style="width: 20px; margin-right: 10px;">
                        Sign in with Google
                    </a>

                    <p class="mt-4 mb-0">New reader? <a href="register.html" class="text-decoration-none fw-bold" style="color: var(--gold);">Create an account</a></p>
                </div>
            </form>
        </div>
    </section>

    <footer class="py-4 mt-auto" style="background-color: #222; border-top: 3px solid #d4af37;">
    <div class="container text-center">
        <p class="mb-0" style="color: #d4af37; font-weight: 500;">
            &copy; 2026 Chapters & Co. | 
            <span style="color: #fff; font-weight: 300;">Secure Bookstore Authentication</span>
        </p>
    </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

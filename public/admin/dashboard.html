<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Chapters & Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="../images/book_logo.png">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <h1>Admin Dashboard</h1>
            <a href="../index.html" class="btn btn-outline-dark">Back to Site</a>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-4 shadow-sm">
                    <h4 class="fw-bold mb-3">Add New Book</h4>
                    <form id="addBookForm">
                        <div class="mb-3">
                            <label>Book Title</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Price (AED)</label>
                            <input type="number" id="price" class="form-control" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label>Image Name (e.g., book1.jpg)</label>
                            <input type="text" id="image" class="form-control" required>
                        </div>
                        <button type="submit" class="product_btn w-100 py-2 border-0">Add Product</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm">
                    <h4 class="fw-bold mb-3">Manage Inventory</h4>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Price</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductList">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-4 shadow-sm mt-4">
    <h4 class="fw-bold mb-3">Recently Registered Users</h4>
    <div id="recentUsersList">
        <p class="text-muted">Loading users...</p>
    </div>
</div>

    
  <script src="../js/admin.js"></script>
</body>
</html>

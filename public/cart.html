<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapters & Co. - Your Shopping Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="images/book_logo.png">
</head>

<body>

  <header class="user_header">
    <div class="header_1">
      <div class="user_flex">
        <div class="logo_cont">
          <img src="images/book_logo.png" alt="Logo">
          <a href="index.html" class="book_logo">Chapters & Co.</a>
        </div>

        <nav class="navbar_links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
          <a href="contact.html">Contact</a>
          <a href="orders.html">Orders</a>
        </nav>

        <div class="last_part">
          <form action="search.html" method="GET" class="search_form">
            <input type="text" name="search" placeholder="Find a book...">
            <button type="submit"><i class="fas fa-search"></i></button>
          </form>
          <div class="icons">
            <a href="cart.html" style="color: var(--gold);"><i class="fas fa-shopping-cart"></i></a>
            <a href="login.html" id="user_btn">
              <i class="fas fa-user"></i>
              <span class="login_text">Sign In</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h2 class="section_title mb-0">Shopping Cart</h2>
        <button onclick="clearCart()" class="btn btn-sm btn-outline-danger" id="clearCartBtn" style="display: none;">
            <i class="fas fa-trash me-1"></i> Clear Cart
        </button>
    </div>
    
    <div class="row gy-4">
      <div class="col-lg-8">
        <div class="cart_items_container"></div>
      </div>

      <div class="col-lg-4">
        <div class="cart_summary_card p-4 shadow-sm rounded-4 bg-light">
          <h4 class="fw-bold mb-4 border-bottom pb-2">Order Summary</h4>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="subtotal" class="fw-bold">AED 0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-3 text-success">
            <span>Shipping</span>
            <span class="fw-bold">FREE</span>
          </div>
          <div class="d-flex justify-content-between border-top pt-3 mb-4">
            <span class="fs-5 fw-bold">Grand Total</span>
            <span id="grand-total" class="fs-5 fw-bold text-dark">AED 0.00</span>
          </div>
          <button onclick="checkAuthAndProceed()" class="product_btn w-100 text-center py-3 mb-2 border-0">
            Proceed to Checkout
          </button>
          <a href="shop.html" class="btn btn-outline-dark w-100 py-2 text-decoration-none">Continue Shopping</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer_main py-5 mt-5">
    <div class="container">
      <hr class="footer_hr">
      <p class="text-center footer_copy">&copy; 2025 Chapters & Co. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

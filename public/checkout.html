<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Chapters & Co.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="images/book_logo.png">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="mb-4">Finalize Your Order</h2>
        <div class="row">
            <div class="col-md-7">
                <div class="card p-4 shadow-sm">
                    <h4>Shipping Details</h4>
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label>Full Name</label>
                            <input type="text" id="orderName" class="form-control" readonly>
                        </div>
                        <div class="mb-3">
                            <label>Delivery Address</label>
                            <textarea id="orderAddress" class="form-control" rows="3" required placeholder="Street, Apartment, City"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Payment Method</label>
                            <select id="paymentMethod" class="form-control">
                                <option value="Cash on Delivery">Cash on Delivery</option>
                                <option value="Card on Delivery">Card on Delivery</option>
                            </select>
                        </div>
                        <button type="submit" class="product_btn w-100 py-3 border-0">Place Order</button>
                    </form>
                </div>
            </div>
            <div class="col-md-5">
                <div class="card p-4 shadow-sm">
                    <h4>Order Summary</h4>
                    <div id="checkoutSummary"></div>
                    <hr>
                    <h5 class="d-flex justify-content-between">
                        <span>Total:</span>
                        <span id="orderTotal">AED 0.00</span>
                    </h5>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

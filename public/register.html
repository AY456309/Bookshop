<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapters & Co. - Join Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" type="image/png" href="images/book_logo.png">
</head>
<body>

  <header class="user_header">
    <div class="header_1">
      <div class="user_flex">
        <div class="logo_cont">
          <img src="images/book_logo.png" alt="Logo">
          <a href="index.html" class="book_logo">Chapters & Co.</a>
        </div>

        <nav class="navbar_links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
          <a href="contact.html">Contact</a>
          <a href="orders.html">Orders</a>
        </nav>

        <div class="last_part">
          <form action="search.html" method="GET" class="search_form">
            <input type="text" name="search" placeholder="Find a book...">
            <button type="submit"><i class="fas fa-search"></i></button>
          </form>
          <div class="icons">
            <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
            <a href="login.html" id="user_btn">
              <i class="fas fa-user"></i>
              <span class="login_text">Sign In</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="container py-5">
      <div class="questions_card mx-auto" style="max-width: 500px; width: 90%; margin-top: 50px;">
          <h2 class="text-center mb-4">Create Account</h2>
          <p class="text-center text-muted mb-4">Join our community of book lovers.</p>

          <form id="registerForm">
              <div class="mb-3">
                  <label class="form-label fw-bold">Full Name</label>
                  <input type="text" id="regName" class="custom_input w-100" placeholder="Enter your full name" required>
              </div>
              <div class="mb-3">
                  <label class="form-label fw-bold">Email Address</label>
                  <input type="email" id="regEmail" class="custom_input w-100" placeholder="name@email.com" required>
              </div>
              <div class="mb-3">
                  <label class="form-label fw-bold">Password</label>
                  <input type="password" id="regPass" class="custom_input w-100" placeholder="Create a password" required>
                  <small class="text-muted mt-1 d-block">Please use only <b>letters and numbers</b> for your password.</small>
              </div>
              
              <button type="submit" class="product_btn w-100 py-3 mt-2">Register Now</button>
              
              <div class="mt-4 text-center">
                  <p class="mb-0">Already have an account? <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--gold);">Login here</a></p>
              </div>
          </form>
      </div>
  </section>

  <footer class="footer_main py-5 mt-5">
    <div class="container text-center">
      <hr class="footer_hr">
      <p class="footer_copy">&copy; 2025 Chapters & Co. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

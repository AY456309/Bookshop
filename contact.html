<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookiee - Contact</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header class="user_header">
    <div class="header_1">
      <div class="user_flex">
        <div class="logo_cont">
          <img src="images/book_logo.png" alt="logo" />
          <a href="home.html" class="book_logo">Bookiee</a>
        </div>
        <nav class="navbar">
          <a href="home.html">Home</a>
          <a href="about.html">About</a>
          <a href="shop.html">Shop</a>
          <a href="contact.html">Contact</a>
        </nav>
        <div class="last_part">
          <div class="icons">
            <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <section class="contact_us">
    <form>
      <h2>Contact Us!</h2>
      <input type="text" name="name" placeholder="Enter your name" required />
      <input type="email" name="email" placeholder="Enter your email" required />
      <input type="tel" name="number" placeholder="Enter your number" required />
      <textarea name="message" placeholder="Your message" cols="30" rows="10"></textarea>
      <input type="submit" value="Send Message" class="product_btn" />
    </form>
  </section>

  <script src="js/script.js"></script>
</body>

<footer class="footer">
  <div class="footer_box_container">
    <div class="footer_box">
      <div class="footer_logo_cont">
        <img src="images/book_logo.png" alt="Logo" />
        <a href="home.html">Bookiee</a>
      </div>
      <p>Explore, Discover, and Buy Your Favorite Books.</p>
    </div>
    <div class="footer_box">
      <h3>Quick Links</h3>
      <a href="home.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="footer_box">
      <h3>Contact</h3>
      <p>Email: info@bookiee.com</p>
      <p>Phone: +971 50 123 4567</p>
      <p>Address: Dubai, UAE</p>
    </div>
    <div class="footer_box">
      <h3>Follow Us</h3>
      <a href="#"><i class="fab fa-facebook-f"></i> Facebook</a>
      <a href="#"><i class="fab fa-twitter"></i> Twitter</a>
      <a href="#"><i class="fab fa-instagram"></i> Instagram</a>
    </div>
  </div>
  <p style="text-align:center; margin-top:1rem;">&copy; 2025 Bookiee. All rights reserved.</p>
</footer>
</html>
